name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── 1. Backend smoke tests ─────────────────────────────────────────────────
  test-api:
    name: API smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
        working-directory: services/api
      - run: npm test
        working-directory: services/api

  # ── 2. Web build ──────────────────────────────────────────────────────────
  build-web:
    name: Build web SPA
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      - run: tar -czf web-dist.tar.gz -C apps/web/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          retention-days: 14

  # ── 2.1 Landing build ──────────────────────────────────────────────────────
  build-landing:
    name: Build landing page
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
        working-directory: apps/landing
      - run: npm run build
        working-directory: apps/landing
      - run: tar -czf landing-dist.tar.gz -C apps/landing/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: landing-dist.tar.gz
          retention-days: 14

  # ── 3. API bundle ─────────────────────────────────────────────────────────
  build-api:
    name: Build API bundle
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
        working-directory: services/api
      - run: npm run build
        working-directory: services/api
      - run: tar -czf api-dist.tar.gz -C services/api/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: api-dist.tar.gz
          retention-days: 14

  # ── 4. Android APK (no EAS — expo prebuild + Gradle) ──────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses & install packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          yes | $SDKMANAGER "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1

      - name: Install mobile dependencies
        run: npm install
        working-directory: apps/mobile

      - name: Install NDK (required by React Native 0.76)
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" > /dev/null 2>&1

      - name: Expo Prebuild (generate Android native project)
        run: npx expo prebuild --platform android --clean
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.API_URL }}

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > apps/mobile/android/local.properties

      - name: Override gradle.properties for CI (arm64 only, SDK 35)
        run: |
          printf '\nreactNativeArchitectures=arm64-v8a\nandroid.buildToolsVersion=35.0.0\nandroid.compileSdkVersion=35\nandroid.targetSdkVersion=35\n' >> apps/mobile/android/gradle.properties

      - name: Make gradlew executable
        run: chmod +x apps/mobile/android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ── 5. Create & Publish GitHub Release ─────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-web, build-landing, build-api, build-android]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download web artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist

      - name: Download landing artifacts
        uses: actions/download-artifact@v4
        with:
          name: landing-dist

      - name: Download API artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-dist

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug

      - name: Generate version & release tag
        id: vars
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "tag_name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_title=Release ${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_title }}
          generate_release_notes: true
          files: |
            web-dist.tar.gz
            landing-dist.tar.gz
            api-dist.tar.gz
            app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
