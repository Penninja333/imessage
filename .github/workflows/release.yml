name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── 1. Backend smoke tests ─────────────────────────────────────────────────
  test-api:
    name: API smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
        working-directory: services/api
      - run: npm test
        working-directory: services/api

  # ── 2. Web build ──────────────────────────────────────────────────────────
  build-web:
    name: Build web SPA
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build -w apps/web
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      - run: tar -czf web-dist.tar.gz -C apps/web/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          retention-days: 14

  # ── 2.1 Landing build ──────────────────────────────────────────────────────
  build-landing:
    name: Build landing page
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
        working-directory: apps/landing
      - run: npm run build
        working-directory: apps/landing
      - run: tar -czf landing-dist.tar.gz -C apps/landing/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: landing-dist.tar.gz
          retention-days: 14

  # ── 3. API bundle ─────────────────────────────────────────────────────────
  build-api:
    name: Build API bundle
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
        working-directory: services/api
      - run: npm run build
        working-directory: services/api
      - run: tar -czf api-dist.tar.gz -C services/api/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: api-dist.tar.gz
          retention-days: 14

  # ── 4. Android APK — Gradle Build (Expo Prebuild + Java 17) ──
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install workspace dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Android native project
        run: |
          cd apps/mobile
          CI=1 yes | npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          EXPO_NO_TELEMETRY: 1

      - name: Build Android APK with Gradle
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Locate and stage APK
        run: |
          mkdir -p dist-apk
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" dist-apk/app-debug.apk
            ls -lh dist-apk/app-debug.apk
          else
            echo "Error: No APK found"
            exit 1
          fi
        working-directory: apps/mobile

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/mobile/dist-apk/app-debug.apk
          retention-days: 30


  # ── 5. Create & Publish GitHub Release ─────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-web, build-landing, build-api, build-android]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download web artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist

      - name: Download landing artifacts
        uses: actions/download-artifact@v4
        with:
          name: landing-dist

      - name: Download API artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-dist

      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: app-debug

      - name: Generate version & release tag
        id: vars
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "tag_name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_title=Release ${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_title }}
          generate_release_notes: true
          files: |
            web-dist.tar.gz
            landing-dist.tar.gz
            api-dist.tar.gz
            app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
