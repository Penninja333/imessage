name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── 1. Backend smoke tests ─────────────────────────────────────────────────
  test-api:
    name: API smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
        working-directory: services/api
      - run: npm test
        working-directory: services/api

  # ── 2. Web build ──────────────────────────────────────────────────────────
  build-web:
    name: Build web SPA
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build -w apps/web
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      - run: tar -czf web-dist.tar.gz -C apps/web/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          retention-days: 14

  # ── 2.1 Landing build ──────────────────────────────────────────────────────
  build-landing:
    name: Build landing page
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
        working-directory: apps/landing
      - run: npm run build
        working-directory: apps/landing
      - run: tar -czf landing-dist.tar.gz -C apps/landing/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: landing-dist.tar.gz
          retention-days: 14

  # ── 3. API bundle ─────────────────────────────────────────────────────────
  build-api:
    name: Build API bundle
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
        working-directory: services/api
      - run: npm run build
        working-directory: services/api
      - run: tar -czf api-dist.tar.gz -C services/api/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: api-dist.tar.gz
          retention-days: 14

  # ── 4. Android APK — EAS Build (Expo's build infrastructure, no local Gradle) ──
  build-android:
    name: Build Android APK (EAS)
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo + EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        run: npm install
        working-directory: apps/mobile

      - name: Build Android APK via EAS (preview profile)
        run: eas build --platform android --profile preview --non-interactive --wait
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Download APK from EAS
        run: |
          BUILD_URL=$(eas build:list --platform android --limit 1 --json --non-interactive | node -e "const fs=require('fs');const d=fs.readFileSync(0,'utf8');try{const j=JSON.parse(d);console.log(j[0]?.artifacts?.buildUrl||'')}catch(e){console.error(e)}")
          echo "Found build URL: $BUILD_URL"
          if [ -n "$BUILD_URL" ]; then
            curl -L "$BUILD_URL" -o app-debug.apk
            ls -lh app-debug.apk
          else
            echo "Warning: Build URL was empty"
          fi
        working-directory: apps/mobile

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/mobile/app-debug.apk
          retention-days: 30
          if-no-files-found: warn


  # ── 5. Create & Publish GitHub Release ─────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-web, build-landing, build-api, build-android]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download web artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist

      - name: Download landing artifacts
        uses: actions/download-artifact@v4
        with:
          name: landing-dist

      - name: Download API artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-dist

      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: app-debug

      - name: Generate version & release tag
        id: vars
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "tag_name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_title=Release ${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_title }}
          generate_release_notes: true
          files: |
            web-dist.tar.gz
            landing-dist.tar.gz
            api-dist.tar.gz
            app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
