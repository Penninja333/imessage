name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── 1. Backend smoke tests ─────────────────────────────────────────────────
  test-api:
    name: API smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
        working-directory: services/api
      - run: npm test
        working-directory: services/api

  # ── 2. Web build ──────────────────────────────────────────────────────────
  build-web:
    name: Build web SPA
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      - run: tar -czf web-dist.tar.gz -C apps/web/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          retention-days: 14

  # ── 2.1 Landing build ──────────────────────────────────────────────────────
  build-landing:
    name: Build landing page
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
        working-directory: apps/landing
      - run: npm run build
        working-directory: apps/landing
      - run: tar -czf landing-dist.tar.gz -C apps/landing/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: landing-dist.tar.gz
          retention-days: 14

  # ── 3. API bundle ─────────────────────────────────────────────────────────
  build-api:
    name: Build API bundle
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
        working-directory: services/api
      - run: npm run build
        working-directory: services/api
      - run: tar -czf api-dist.tar.gz -C services/api/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: api-dist.tar.gz
          retention-days: 14

  # ── 4. Android APK — Gradle direct build (no EAS, no expo prebuild) ────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Android SDK: accept all licenses + install required packages ──────
      - name: Setup Android SDK components
        run: |
          SDK="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # Accept all licenses non-interactively
          yes | $SDK --licenses > /dev/null 2>&1 || true
          # Install what the build needs (SDK 35, build-tools 35, NDK for RN 0.76)
          $SDK "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      # ── Install JS dependencies so Gradle scripts can require() them ──────
      - name: Install mobile JS dependencies
        run: npm install
        working-directory: apps/mobile

      # ── KEY FIX: Gradle's settings.gradle spawns `node` child processes
      #    from the android/ directory to find expo packages via require.resolve().
      #    Symlinking node_modules directly into android/ means node finds
      #    packages in cwd immediately (no directory-walking required).  ──────
      - name: Symlink node_modules into android/ for Gradle script resolution
        run: |
          ln -sf "${{ github.workspace }}/apps/mobile/node_modules" \
                 "${{ github.workspace }}/apps/mobile/android/node_modules"

      # ── Configure SDK path + fast CI build options ───────────────────────
      - name: Configure local.properties & gradle.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > apps/mobile/android/local.properties
          cat >> apps/mobile/android/gradle.properties << 'PROPS'

          # CI overrides
          reactNativeArchitectures=arm64-v8a
          android.buildToolsVersion=35.0.0
          android.compileSdkVersion=35
          android.targetSdkVersion=35
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          org.gradle.parallel=true
          PROPS

      - name: Make gradlew executable
        run: chmod +x apps/mobile/android/gradlew

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --warning-mode=all
        working-directory: apps/mobile/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30


  # ── 5. Create & Publish GitHub Release ─────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-web, build-landing, build-api, build-android]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download web artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist

      - name: Download landing artifacts
        uses: actions/download-artifact@v4
        with:
          name: landing-dist

      - name: Download API artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-dist

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug

      - name: Generate version & release tag
        id: vars
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "tag_name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_title=Release ${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_title }}
          generate_release_notes: true
          files: |
            web-dist.tar.gz
            landing-dist.tar.gz
            api-dist.tar.gz
            app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
